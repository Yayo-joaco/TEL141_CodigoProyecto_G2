<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesando - PUCP Cloud Orchestrator</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .task-card {
            max-width: 560px;
            margin: 60px auto;
        }
        .task-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #1e3742;
            border-top-color: #4db8ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .task-icon { font-size: 36px; margin-bottom: 12px; }
        .task-status-pill {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin-top: 8px;
        }
        .pill-running  { background: #1a3a5a; color: #4db8ff; border: 1px solid #2a6f97; }
        .pill-pending  { background: #2a2a2a; color: #aaa;    border: 1px solid #444; }
        .pill-completed{ background: #1a3a2a; color: #4dff88; border: 1px solid #2a7a4a; }
        .pill-failed   { background: #3a1a1a; color: #ff6060; border: 1px solid #7a2a2a; }
        .task-name {
            font-size: 12px;
            color: #6a8a9a;
            margin-top: 6px;
            font-family: monospace;
        }
        .task-times {
            font-size: 11px;
            color: #4a6a7a;
            margin-top: 12px;
            line-height: 1.8;
        }
        .task-error {
            background: #2a1a1a;
            border: 1px solid #7a2a2a;
            border-radius: 6px;
            padding: 10px 14px;
            color: #ff8080;
            font-size: 12px;
            margin-top: 14px;
            text-align: left;
            display: none;
        }
        .task-success {
            background: #1a2a1a;
            border: 1px solid #2a7a4a;
            border-radius: 6px;
            padding: 10px 14px;
            color: #4dff88;
            font-size: 12px;
            margin-top: 14px;
            display: none;
        }
    </style>
</head>
<body>
    {% include "_navbar.html" %}

    <div class="container">
        <div class="card task-card" style="text-align:center;padding:36px 32px;">
            <div id="spinner-area">
                <div class="task-spinner"></div>
            </div>
            <h2 style="font-size:16px;margin-bottom:4px;">Procesando operación</h2>
            <div class="task-name" id="task-name"></div>
            <div>
                <span class="task-status-pill pill-running" id="status-pill">running</span>
            </div>
            <div class="task-times">
                <div>Ticket: <code style="color:#4db8ff;font-size:11px;">{{ ticket_id }}</code></div>
                <div>Iniciado: <span id="created-at">—</span></div>
                <div>Finalizado: <span id="finished-at">—</span></div>
            </div>
            <div class="task-error" id="error-box"></div>
            <div class="task-success" id="success-box">Operación completada. Redirigiendo...</div>
            <div style="margin-top:20px;">
                <a href="{{ redirect_url | default('/') }}" class="btn btn-primary btn-sm">Volver</a>
            </div>
        </div>
    </div>

    <div class="footer">PUCP Cloud Orchestrator - TEL141 2026-1 - Grupo 2</div>

    <script>
    const ticketId = "{{ ticket_id }}";
    const redirectUrl = "{{ redirect_url | default('/') }}";
    let pollInterval = null;

    const pillClass = {
        pending:   "pill-pending",
        running:   "pill-running",
        completed: "pill-completed",
        failed:    "pill-failed",
    };

    function poll() {
        fetch("/api/task/" + ticketId)
            .then(r => r.json())
            .then(data => {
                if (!data || data.error === "not_found") return;

                var pill = document.getElementById("status-pill");
                pill.textContent = data.status;
                pill.className = "task-status-pill " + (pillClass[data.status] || "pill-pending");

                if (data.name) document.getElementById("task-name").textContent = data.name;
                if (data.created_at) document.getElementById("created-at").textContent = data.created_at.replace("T", " ").slice(0, 19);
                if (data.finished_at) document.getElementById("finished-at").textContent = data.finished_at.replace("T", " ").slice(0, 19);

                if (data.status === "completed") {
                    clearInterval(pollInterval);
                    document.getElementById("spinner-area").innerHTML = '<div class="task-icon">✓</div>';
                    document.getElementById("success-box").style.display = "block";
                    setTimeout(function() { window.location.href = redirectUrl; }, 1200);
                } else if (data.status === "failed") {
                    clearInterval(pollInterval);
                    document.getElementById("spinner-area").innerHTML = '<div class="task-icon" style="color:#ff6060;">✗</div>';
                    var errBox = document.getElementById("error-box");
                    errBox.style.display = "block";
                    errBox.textContent = "Error: " + (data.error || "desconocido");
                }
            })
            .catch(function() {});
    }

    pollInterval = setInterval(poll, 2000);
    poll();
    </script>
</body>
</html>
