<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado de Tarea - PUCP Cloud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .status-card { max-width: 640px; margin: 80px auto; }
        .spinner-border { width: 3rem; height: 3rem; }
        #status-badge { font-size: 1.1rem; }
    </style>
</head>
<body>
{% include '_navbar.html' %}
<div class="container">
  <div class="card shadow status-card">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">Procesando operación</h5>
    </div>
    <div class="card-body text-center py-5">
      <div id="spinner" class="mb-3">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
      </div>
      <h6 class="text-muted mb-2">Ticket</h6>
      <code id="ticket-id" class="fs-6">{{ ticket_id }}</code>
      <div class="mt-3">
        <span id="status-badge" class="badge bg-secondary">pendiente</span>
      </div>
      <p id="task-name" class="text-muted mt-2 mb-0"></p>
      <div id="error-box" class="alert alert-danger mt-3 d-none"></div>
      <div id="result-box" class="alert alert-success mt-3 d-none"></div>
      <div class="mt-4">
        <small class="text-muted">Iniciado: <span id="created-at">—</span></small><br>
        <small class="text-muted">Finalizado: <span id="finished-at">—</span></small>
      </div>
    </div>
    <div class="card-footer text-center">
      <a href="/" class="btn btn-outline-secondary btn-sm">Volver al inicio</a>
    </div>
  </div>
</div>
<script>
const ticketId = "{{ ticket_id }}";
const redirectUrl = "{{ redirect_url | default('/') }}";
let pollInterval = null;

const statusColors = {
  pending:   "secondary",
  running:   "primary",
  completed: "success",
  failed:    "danger",
};

function poll() {
  fetch("/api/task/" + ticketId)
    .then(r => r.json())
    .then(data => {
      if (!data || data.error === "not_found") return;

      document.getElementById("status-badge").textContent = data.status;
      document.getElementById("status-badge").className =
        "badge bg-" + (statusColors[data.status] || "secondary");
      document.getElementById("task-name").textContent = data.name || "";
      document.getElementById("created-at").textContent = data.created_at || "—";
      document.getElementById("finished-at").textContent = data.finished_at || "—";

      if (data.status === "completed") {
        clearInterval(pollInterval);
        document.getElementById("spinner").innerHTML =
          '<span class="fs-1">&#10003;</span>';
        document.getElementById("result-box").classList.remove("d-none");
        document.getElementById("result-box").textContent =
          "Operación completada exitosamente.";
        setTimeout(() => { window.location.href = redirectUrl; }, 1500);
      } else if (data.status === "failed") {
        clearInterval(pollInterval);
        document.getElementById("spinner").innerHTML =
          '<span class="fs-1 text-danger">&#10007;</span>';
        const errBox = document.getElementById("error-box");
        errBox.classList.remove("d-none");
        errBox.textContent = "Error: " + (data.error || "desconocido");
      }
    })
    .catch(() => {});
}

pollInterval = setInterval(poll, 2000);
poll();
</script>
</body>
</html>
