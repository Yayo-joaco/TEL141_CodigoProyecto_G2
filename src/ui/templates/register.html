<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - PUCP Cloud Orchestrator</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .login-container { max-width: 420px; margin: 80px auto; }
        .login-container h1 { text-align: center; font-size: 28px; margin-bottom: 8px; }
        .login-container .subtitle { text-align: center; color: #8ab4d8; font-size: 13px; margin-bottom: 30px; }
        .login-card { background: #162430; border: 1px solid #1e3742; border-radius: 10px; padding: 30px; }
        .login-card h2 { font-size: 18px; color: #4db8ff; margin-bottom: 20px; text-align: center; }
        .login-footer { text-align: center; margin-top: 16px; font-size: 13px; color: #8ab4d8; }
        .login-footer a { color: #4db8ff; text-decoration: none; }
    </style>
</head>
<body>
    {% include "_navbar.html" %}
    <div class="login-container">
        <h1>☁ PUCP Cloud Orchestrator</h1>
        <p class="subtitle">Registro de Usuario</p>
        <div class="login-card">
            <h2>Crear Cuenta</h2>
            {% if error %}
            <div class="alert alert-error">{{ error }}</div>
            {% endif %}
            <form method="POST">
                <div class="form-group">
                    <label>Usuario</label>
                    <input type="text" name="username" placeholder="mi_usuario" required>
                </div>
                <div class="form-group">
                    <label>Email (opcional)</label>
                    <input type="email" name="email" placeholder="mi@email.com">
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" name="password" required>
                </div>
                <div class="form-group">
                    <label>Rol</label>
                    <select name="role">
                        <option value="user">Usuario</option>
                        <option value="operator">Operador</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Registrarse</button>
            </form>
            <div class="login-footer">
                ¿Ya tienes cuenta? <a href="/login">Iniciar sesión</a>
            </div>
        </div>
    </div>
</body>
</html>
