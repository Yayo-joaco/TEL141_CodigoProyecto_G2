<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PUCP Cloud Orchestrator</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-hero">
        <div class="login-hero-overlay"></div>
        <div class="login-hero-content">
            <div class="login-shell">
                <div class="login-grid">
                    <section class="login-visual-panel" aria-label="Imagen de bienvenida PUCP">
                        <img src="/static/resources/pucp-foto-login.webp" alt="PUCP" class="login-visual-image">
                        <div class="login-visual-overlay"></div>
                        <div class="login-visual-content">
                            <img src="/static/resources/negative-logo-pucp.png" alt="PUCP logo" class="login-brand-image">
                
                        
                        </div>
                    </section>

                    <section class="login-card login-card-main">
                        <div class="login-card-header">
                            <div>
                                <h2><i class="fas fa-lock-open me-2"></i>Iniciar Sesión</h2>
                            </div>
                            <span class="login-card-chip">RBAC</span>
                        </div>

                        {% if error %}
                        <div class="alert alert-error">
                            <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
                        </div>
                        {% endif %}

                        <form method="POST" class="login-form">
                            <div class="form-group">
                                <label for="username">
                                    <i class="fas fa-user" style="color: #4db8ff;"></i> Usuario
                                </label>
                                <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required class="form-input">
                            </div>

                            <div class="form-group">
                                <label for="password">
                                    <i class="fas fa-key" style="color: #4db8ff;"></i> Contraseña
                                </label>
                                <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required class="form-input">
                            </div>

                            <button type="submit" class="btn-login-primary">
                                <i class="fas fa-sign-in-alt me-2"></i>Acceder al Sistema
                            </button>
                        </form>

                        <div class="login-footer">
                            <p>¿No tienes cuenta? <a href="/register" class="login-link">Crear una nueva</a></p>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
