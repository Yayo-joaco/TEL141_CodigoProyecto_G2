# ==============================================================
# PUCP Cloud Orchestrator - Hosts Configuration
# Grupo: G2
# Fase: 2 - App server → Linux Cluster + OpenStack Cluster
# ==============================================================

# App server (runs all backend code)
app_server:
  hostname: "app"
  ip: "localhost"      # adjust if app server has its own IP
  role: "orchestrator"

# ---------------------------------------------------------------
# Linux Cluster  (192.168.201.x)
# ---------------------------------------------------------------
linux_cluster:
  headnode:
    hostname: "server1"
    ip: "192.168.201.1"
    port: 22
    user: "ubuntu"
    role: "headnode"

  workers:
    - hostname: "server2"
      ip: "192.168.201.2"
      port: 22
      user: "ubuntu"
      role: "worker"
    - hostname: "server3"
      ip: "192.168.201.3"
      port: 22
      user: "ubuntu"
      role: "worker"
    - hostname: "server4"
      ip: "192.168.201.4"
      port: 22
      user: "ubuntu"
      role: "worker"

  ovs:
    hostname: "ovs1"
    ip: "192.168.201.5"
    port: 22
    user: "ubuntu"
    role: "ovs"

# ---------------------------------------------------------------
# OpenStack Cluster  (192.168.202.x)
# ---------------------------------------------------------------
openstack_cluster:
  headnode:
    hostname: "controller"
    ip: "192.168.202.1"
    port: 22
    user: "ubuntu"
    role: "openstack_headnode"

  workers:
    - hostname: "compute1"
      ip: "192.168.202.2"
      port: 22
      user: "ubuntu"
      role: "openstack_worker"
    - hostname: "compute2"
      ip: "192.168.202.3"
      port: 22
      user: "ubuntu"
      role: "openstack_worker"
    - hostname: "compute3"
      ip: "192.168.202.4"
      port: 22
      user: "ubuntu"
      role: "openstack_worker"

  ovs:
    hostname: "ovs2"
    ip: "192.168.202.5"
    port: 22
    user: "ubuntu"
    role: "ovs"

# ---------------------------------------------------------------
# SSH
# ---------------------------------------------------------------
ssh:
  key_path: "/home/ubuntu/.ssh/id_rsa"
  timeout: 30
  sudo: true

# ---------------------------------------------------------------
# VPN gateway — routes 10.60.4.0/24 (OpenStack external) to the
# OpenStack headnode so VMs with internet enabled are directly
# SSH-reachable over VPN. One-time setup via
# scripts/setup_gateway_routing.py, not touched on every deploy.
# ---------------------------------------------------------------
gateway:
  hostname: "gateway"
  ip: "10.20.11.103"
  port: 22
  user: "ubuntu"
  role: "gateway"

# ---------------------------------------------------------------
# VM defaults
# ---------------------------------------------------------------
vm_resources:
  default_vcpus: 1
  default_ram_mb: 512
  default_disk_gb: 2

base_image:
  path: "/home/ubuntu/cirros-base.img"
  format: "qcow2"
